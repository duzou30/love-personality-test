<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ee"><title>测你的恋爱人格</title><style>:root{--bg:#fff8ee;--peach:#ff9e7d;--mint:#8fd0b2;--yellow:#ffd66b;--ink:#4a3428;--paper:#fffdf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}button{font:inherit;color:inherit;cursor:pointer}#app{min-height:100svh;max-width:740px;margin:auto;padding:20px 16px 12px;display:flex;flex-direction:column}.screen{flex:1;display:flex;flex-direction:column;justify-content:center}.card{background:var(--paper);padding:24px;border:1px solid #f1e4d5;border-radius:26px;box-shadow:0 12px 36px #76583b12}.hero{text-align:center;align-items:center}.hero h1{font-size:clamp(32px,8vw,46px);line-height:1.25;margin:12px 0}.hero p{color:#806a5b}.icon{width:140px;height:140px;margin:18px auto;border-radius:48%;background:#ffe8d9;display:grid;place-items:center;font-size:76px}.preview{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 18px}.preview span,.tag{background:#fff0d4;border-radius:99px;padding:6px 12px;font-size:14px}.primary,.secondary{border:0;border-radius:999px;min-height:52px;padding:13px 22px;font-weight:750}.primary{background:var(--peach);color:white}.secondary{background:#f4eadc}.hint,.footer{font-size:12px;color:#927d6f}.footer{text-align:center;padding-top:14px}.hint{margin-top:10px}.top{display:flex;justify-content:space-between;font-size:14px;font-weight:700}.track{height:8px;background:#f0e6d9;border-radius:99px;margin:12px 0 22px;overflow:hidden}.fill{height:100%;background:var(--peach)}.question{font-size:24px;line-height:1.4;margin:0 0 18px}.options{display:grid;gap:10px}.option{min-height:56px;text-align:left;padding:13px 16px;border:1px solid #efe2d3;border-radius:18px;background:#fff}.option:hover{border-color:var(--peach);background:#fff4ed}.option:active,.primary:active,.secondary:active{transform:scale(.98)}.back{border:0;background:none;text-align:left;color:#806a5b;padding:12px 0 0}.loading{text-align:center;align-items:center}.loading .icon{margin:0 auto 20px}.dots{display:flex;gap:8px;margin:16px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--peach);animation:b .7s infinite alternate}.dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}@keyframes b{to{transform:translateY(-8px);opacity:.5}}.result-head{text-align:center}.result-head .icon{width:118px;height:118px;font-size:64px;margin:0 auto 12px}.result-head h2{font-size:28px;margin:6px}.slogan{color:#806a5b;margin:4px 0 14px}.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.tag{background:#e8f5ee;font-weight:700}.result h3{font-size:16px;margin:18px 0 5px}.result p{margin:0;color:#70594a}.match{margin-top:12px;background:#fff5d8;padding:12px;border-radius:16px}.actions{display:grid;gap:9px;margin-top:17px}.actions button{width:100%}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#4a3428;color:white;padding:10px 17px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1}@media(max-width:480px){#app{padding:17px 14px 10px}.card{padding:20px 16px}.question{font-size:22px}}</style></head><body><main id="app"></main><div id="toast" class="toast" role="status"></div><script>const results=[{"id":"hot","name":"直球热烈型","emoji":"❤️","slogan":"喜欢就别藏着，心动要趁热分享","tags":["坦率","热情","行动派"],"read":"你喜欢一个人时，细节会先替你开口：主动问候、认真安排见面，也不吝啬表达欣赏。关系里的回应会让你更有安全感，所以你倾向把话说清楚、把喜欢做出来。你适合和同样真诚的人并肩，让热烈有来有回。","bright":"让喜欢的人感受到被重视","quirk":"发消息有时比对方打字还快","match":"慢热长情型","lucky":"一张临时约会电影票","color":"#fde4df"},{"id":"slow","name":"慢热长情型","emoji":"🌙","slogan":"不急着心动，认定后就走很久","tags":["谨慎","专一","细腻"],"read":"你需要时间确认相处是否舒服，不会因为一时上头就交出全部信任。熟悉之后，你会把对方说过的小事放在心上，用稳定的陪伴表达在意。你看重关系能否经得起日常，而不是只看开场够不够浪漫。","bright":"认真倾听并记住重要细节","quirk":"想说的话会先在心里排练几遍","match":"务实过日子型","lucky":"一本写满小事的备忘录","color":"#e7e9f5"},{"id":"cat","name":"黏人小猫型","emoji":"🐈","slogan":"亲近是我的语言，回应是我的安心","tags":["依恋","可爱","重视陪伴"],"read":"喜欢的人会自然进入你的日常：看到好玩的想分享，空下来也想听听对方的声音。你表达亲密很直接，也希望彼此保持稳定联系。只要给双方留出舒服的空间，你的依赖感会变成很甜的陪伴。","bright":"善于表达想念和在乎","quirk":"对方回消息慢时容易脑补小剧场","match":"直球热烈型","lucky":"一对可爱的分享耳机","color":"#f5e4ee"},{"id":"clear","name":"独立清醒型","emoji":"🪞","slogan":"喜欢你，也记得好好喜欢自己","tags":["边界感","理性","自洽"],"read":"你愿意投入关系，但不会把生活的方向盘交出去。遇到分歧时，你希望把需求说明白，而不是靠猜测维持表面和气。你欣赏彼此都有自己的生活，再带着选择走到一起。","bright":"沟通时能清楚说出需求","quirk":"偶尔显得像在开关系复盘会","match":"佛系随缘型","lucky":"一本留白很多的日程本","color":"#e4f1ec"},{"id":"dream","name":"浪漫造梦型","emoji":"✨","slogan":"把普通的一天，也过成值得记住的章节","tags":["仪式感","想象力","感性"],"read":"你会留心关系里的氛围和纪念日，喜欢把心意变成具体的小惊喜。对你来说，浪漫不一定要昂贵，而是对方真的记得你喜欢什么。现实安排也重要；偶尔把期待说出来，彼此就更容易一起把日子过得有光。","bright":"很会制造被珍惜的瞬间","quirk":"脑内预告片有时比现实长","match":"黏人小猫型","lucky":"一张手写的小卡片","color":"#f7e4f2"},{"id":"practical","name":"务实过日子型","emoji":"🧺","slogan":"喜欢不是口号，是一起把日子安排好","tags":["可靠","踏实","照顾型"],"read":"你表达感情常常落在行动里：记得对方的习惯，愿意分担麻烦，也会认真商量未来安排。比起空泛承诺，你更相信持续出现和彼此配合。别忘了偶尔也说说心里话，让你的可靠更容易被听见。","bright":"能把关心落实到生活细节","quirk":"容易把约会做成待办清单","match":"慢热长情型","lucky":"两个人都爱吃的小零食","color":"#f3e9d5"},{"id":"pushpull","name":"拉扯暧昧型","emoji":"🪁","slogan":"心里有浪潮，嘴上还在说“再看看”","tags":["敏锐","试探","慢启动"],"read":"你对气氛变化很敏感，心动时会留意对方的每个信号，却不一定马上表态。你想确认安全再靠近，所以有时显得忽远忽近。把试探换成一点点坦白，能让关系少绕弯，也让别人看见你的认真。","bright":"察觉关系里的微妙变化","quirk":"想太多时容易把简单事变复杂","match":"独立清醒型","lucky":"一杯适合慢慢喝的热茶","color":"#e5e9f4"},{"id":"easy","name":"佛系随缘型","emoji":"🍃","slogan":"合适的相遇，不用一路赶进度","tags":["松弛","包容","自然"],"read":"你不太想给关系设定统一进度表，更愿意看相处是否自然舒服。你有自己的生活，也能接受两个人偶尔各忙各的；真正重要时，你仍会认真出现。把在意及时表达出来，会让你的松弛更像安心，而不是让人猜。","bright":"相处轻松，不给彼此压力","quirk":"有时随和到忘了说自己的偏好","match":"浪漫造梦型","lucky":"一段不用赶时间的散步","color":"#e6f2e8"}];const questions=[["刚认识一个让你心动的人，你最可能？",["找个自然的理由主动聊起来",["hot","cat"]],["先观察相处感觉，慢慢熟悉",["slow","clear"]],["想象下次见面的场景，偷偷期待",["dream","pushpull"]],["顺其自然，遇到再说",["easy","practical"]]],["你理想的联系频率更像？",["想到就说，分享欲不想等",["hot","cat"]],["每天稳定聊一会儿就够",["slow","practical"]],["有趣的事和特别的心情都想分享",["dream","pushpull"]],["各忙各的，见面时好好相处",["clear","easy"]]],["看到对方和别人聊得很开心，你会？",["直接问问情况，不喜欢猜",["hot","clear"]],["先看事实，不急着下结论",["slow","practical"]],["心里有点酸，想要一个抱抱",["cat","dream"]],["尊重对方社交，回头再自然聊聊",["easy","pushpull"]]],["发生小争执时，你希望怎么处理？",["趁热把话说开，别冷战",["hot","clear"]],["都冷静一下，再认真沟通",["slow","practical"]],["先缓和气氛，让彼此知道还在乎",["cat","dream"]],["给一点空间，等双方准备好",["easy","pushpull"]]],["你对恋爱仪式感的想法？",["不必铺张，但重要日子要记得",["dream","practical"]],["日常的小惊喜最打动我",["cat","hot"]],["心意比形式重要，稳定相处更重要",["slow","clear"]],["不设硬性要求，舒服就好",["easy","pushpull"]]],["约会预算你通常怎么想？",["愿意为特别体验花一点",["dream","hot"]],["提前商量，安排得彼此舒服",["practical","clear"]],["小而温馨就好，重在陪伴",["cat","slow"]],["看当天心情，不想被预算绑住",["easy","pushpull"]]],["你更喜欢怎样让身边人知道恋情？",["开心就自然分享，不刻意藏着",["hot","dream"]],["等关系稳定后再告诉重要的人",["slow","clear"]],["想低调但会在小地方秀恩爱",["cat","practical"]],["不太在意标签，自己舒服就好",["easy","pushpull"]]],["如果要异地一段时间，你最在意？",["固定联系和明确的下一次见面",["cat","practical"]],["彼此信任，有事能坦白沟通",["slow","clear"]],["一起计划远程小约会保持新鲜",["dream","hot"]],["先把自己的生活过好，顺其自然",["easy","pushpull"]]],["对你来说，心动通常发生在？",["对方主动又真诚地回应我",["hot","cat"]],["相处久了发现细节很合拍",["slow","practical"]],["某个有氛围的瞬间突然击中我",["dream","pushpull"]],["并肩做事时觉得自在可靠",["clear","easy"]]],["上一段或想象中的关系里，你更像？",["先开口、先安排的人",["hot","dream"]],["默默记得对方习惯的人",["slow","practical"]],["需要很多陪伴和回应的人",["cat","pushpull"]],["保留个人节奏、坦诚沟通的人",["clear","easy"]]],["如果对方忙到晚回消息，你会？",["发一句关心，等空了再说",["hot","practical"]],["理解忙碌，之后再确认近况",["slow","clear"]],["会想念，想收到一句报备",["cat","dream"]],["继续做自己的事，不太受影响",["easy","pushpull"]]],["最让你觉得“这段关系真好”的画面？",["两个人把喜欢说得明明白白",["hot","cat"]],["平凡日子里一直互相照顾",["slow","practical"]],["一起创造只有你们懂的回忆",["dream","pushpull"]],["亲密又自由，谁也不用勉强自己",["clear","easy"]]]];const order=results.map(x=>x.id);let answers=Array(12).fill(null),idx=0;const app=document.querySelector('#app'),foot='<footer class="footer">本测试仅供娱乐，开心就好</footer>';function home(){answers=Array(12).fill(null);idx=0;app.innerHTML=`<section class="screen hero"><div class="icon">❤️</div><h1>测你的恋爱人格</h1><p>你在喜欢里是什么样子？12 道日常小题，看看心动时的你。</p><div class="preview">${results.map(x=>`<span>${x.name}</span>`).join('')}</div><button class="primary" id="start">开始测试</button><div class="hint">12 题 · 约 1 分钟 · 无需登录 · 结果可以保存分享</div></section>${foot}`;document.querySelector('#start').onclick=()=>{idx=0;question()}}function question(){const[q,...opts]=questions[idx];app.innerHTML=`<section class="screen"><div class="card"><div class="top"><span>凭第一感觉选就好</span><span>第 ${idx+1} / 12 题</span></div><div class="track"><div class="fill" style="width:${(idx+1)/12*100}%"></div></div><h2 class="question">${q}</h2><div class="options">${opts.map((o,i)=>`<button class="option" data-n="${i}">${'ABCD'[i]}　${o[0]}</button>`).join('')}</div><button class="back" id="back" ${idx===0?'disabled':''}>← 上一题</button></div></section>${foot}`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[idx]=+b.dataset.n;if(idx<11){idx++;question()}else loading()});document.querySelector('#back').onclick=()=>{if(idx>0){idx--;question()}}}function winner(){let scores=Object.fromEntries(order.map(id=>[id,0]));answers.forEach((n,i)=>questions[i][n+1][1].forEach(id=>scores[id]++));return results.find(r=>r.id===order.slice().sort((a,b)=>scores[b]-scores[a]||order.indexOf(a)-order.indexOf(b))[0])}function loading(){app.innerHTML=`<section class="screen loading"><div class="icon">✨</div><h2>正在拆开你的心动说明书…</h2><div class="dots"><i></i><i></i><i></i></div></section>${foot}`;setTimeout(show,1050)}function show(){const r=winner();app.innerHTML=`<section class="screen"><article class="card result"><div class="result-head"><div class="icon" style="background:${r.color}">${r.emoji}</div><h2>${r.name}</h2><div class="slogan">「${r.slogan}」</div><div class="tags">${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><h3>关于你</h3><p>${r.read}</p><h3>你的闪光点</h3><p>${r.bright}</p><h3>小小短板</h3><p>${r.quirk}</p><div class="match"><b>最合拍：${r.match}</b></div><h3>今日幸运物</h3><p>${r.lucky}</p><div class="actions"><button class="primary" id="save">保存结果图</button><button class="secondary" id="copy">复制分享文案</button><button class="secondary" id="again">再测一次</button></div></article></section>${foot}`;document.querySelector('#save').onclick=()=>save(r);document.querySelector('#copy').onclick=()=>copy(`我的${恋爱人格}结果是「${r.name}」！你测出来会是什么？来一起看看～`);document.querySelector('#again').onclick=home}function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}async function copy(s){try{await navigator.clipboard.writeText(s);toast('分享文案复制好啦！')}catch(e){let t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity=0;document.body.append(t);t.select();try{document.execCommand('copy');toast('分享文案复制好啦！')}catch(_){toast('复制失败，请手动复制')}t.remove()}}function save(r){let c=document.createElement('canvas');c.width=750;c.height=1000;let x=c.getContext('2d');x.fillStyle='#fff8ee';x.fillRect(0,0,750,1000);x.fillStyle='#fffdf8';x.beginPath();x.roundRect(42,42,666,916,40);x.fill();x.textAlign='center';x.fillStyle='#4a3428';x.font='700 38px sans-serif';x.fillText('测你的恋爱人格',375,142);x.fillStyle=r.color;x.beginPath();x.arc(375,385,155,0,Math.PI*2);x.fill();x.font='140px sans-serif';x.fillText(r.emoji,375,438);x.fillStyle='#4a3428';x.font='700 48px sans-serif';x.fillText(r.name,375,620);x.fillStyle='#806a5b';x.font='28px sans-serif';x.fillText(r.slogan,375,685);r.tags.forEach((t,i)=>{let xx=140+i*165;x.fillStyle='#e8f5ee';x.beginPath();x.roundRect(xx,738,140,54,27);x.fill();x.fillStyle='#4a3428';x.font='24px sans-serif';x.fillText(t,xx+70,774)});x.fillStyle='#aa9280';x.font='22px sans-serif';x.fillText('本测试仅供娱乐，开心就好',375,890);c.toBlob(b=>{if(!b){toast('图片生成失败');return}let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='love-personality-test-result.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('结果图已保存')},'image/png')}home();</script></body></html>
